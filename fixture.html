<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Price-sync fixture — Team Rockets Exchange</title>
<meta name="robots" content="noindex" />
<!-- Test fixture. Served at the site root so every relative asset path in the
     real index.html keeps working; the only difference is that PRICE_API points
     at a local mock so tools/qa.js can exercise the live-sync path end to end.
     Not linked from anywhere and marked noindex. -->
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<a class="skip-link" href="#vault">Skip to the vault</a>

<header class="site-header" id="siteHeader" data-header>
  <div class="shell header-inner">
    <a class="brand" href="#top" aria-label="Team Rockets Exchange — back to top">
      <span class="brand-mark" data-monogram="44" aria-hidden="true"></span>
      <span class="brand-words">
        <span class="brand-name">Team Rockets Exchange</span>
        <span class="brand-sub">Premium Pokémon Vault</span>
      </span>
    </a>
    <nav class="nav" id="primaryNav" aria-label="Primary">
      <a href="#vault">Vault</a>
      <a href="#inventory">Inventory</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="section" id="vault" aria-labelledby="vaultTitle">
    <div class="shell">
      <header class="section-head">
        <h1 class="section-title" id="vaultTitle">Price sync fixture</h1>
        <p class="price-status" data-price-status role="status" aria-live="polite">
          <span class="price-dot" aria-hidden="true"></span>
          <span data-price-status-text>Loading prices…</span>
        </p>
      </header>
      <div class="card-grid" data-grid="featured"></div>
      <div class="card-grid" data-grid="inventory" hidden></div>
      <div class="chip-row" data-chips hidden></div>
      <div class="cat-grid" data-cat-grid hidden></div>
      <div class="empty-note" data-empty hidden></div>
    </div>
  </section>
</main>

<div class="lightbox" data-lightbox hidden>
  <div class="lightbox-scrim" data-lightbox-close tabindex="-1"></div>
  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lbName" data-lb-panel>
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close details"></button>
    <div class="lb-zoom" data-lb-zoom role="button" tabindex="0" aria-pressed="false">
      <img data-lb-img alt="" width="630" height="880" />
    </div>
    <h3 id="lbName" data-lb-name></h3>
    <p class="lb-set" data-lb-set></p>
    <p class="lb-meta" data-lb-meta></p>
    <span class="lb-price" data-lb-price></span>
    <dl class="lb-specs">
      <div data-lb-grade-row hidden><dt>Grade</dt><dd data-lb-grade></dd></div>
      <div data-lb-cat-row hidden><dt>Drawer</dt><dd data-lb-cat></dd></div>
      <div><dt>Availability</dt><dd data-lb-avail></dd></div>
      <div><dt>Pricing</dt><dd data-lb-source></dd></div>
    </dl>
    <a data-lb-dm href="#"></a>
    <button data-lb-prev></button>
    <button data-lb-next></button>
  </div>
</div>

<script src="data/products.js"></script>
<script>
  /* Point the sync at the local mock before main.js (a module, so deferred)
     evaluates. A test-only 800ms budget keeps the failure path quick. */
  window.TRE_DATA.CONFIG.PRICE_API = "http://127.0.0.1:5199/prices";
  window.TRE_DATA.CONFIG.FETCH_TIMEOUT_MS = 800;
  /* Stand-in collectrIds so the sync has something real to ask for. */
  window.TRE_DATA.PRODUCTS[0].collectrId = "9001";   /* Charizard,  fallback 9974 */
  window.TRE_DATA.PRODUCTS[1].collectrId = "9002";   /* Umbreon,   fallback 3999 */
</script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
